<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a5cff"/>
      <stop offset=".55" stop-color="#0f2a9e"/>
      <stop offset="1" stop-color="#070f3d"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".18" r=".75">
      <stop offset="0" stop-color="#9fc2ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9fc2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fd0ff"/>
      <stop offset=".5" stop-color="#2f6bff"/>
      <stop offset="1" stop-color="#1b2fa8"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f1ff"/>
      <stop offset="1" stop-color="#9bb2e6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfdcff"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#020722" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- wordmark -->
  <text x="512" y="335" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="200" letter-spacing="14" fill="url(#word)" filter="url(#drop)">FRAN</text>
  <!-- curved TV -->
  <g filter="url(#drop)">
    <path d="M196 438 Q512 398 828 438 L812 742 Q512 712 212 742 Z" fill="url(#bezel)"/>
    <path d="M226 466 Q512 432 798 466 L784 714 Q512 688 240 714 Z" fill="url(#screen)"/>
    <path d="M226 466 Q512 432 798 466 L790 560 Q520 520 232 610 Z" fill="url(#shine)"/>
    <path d="M462 520 L462 664 L590 592 Z" fill="#fff" stroke="#fff" stroke-width="22" stroke-linejoin="round"/>
    <path d="M440 752 L584 752 L614 806 L410 806 Z" fill="url(#bezel)"/>
  </g>
</svg>
